<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صانع الاستبيانات</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Amiri:wght@400;700&display=swap">
<style>
/* Layout: one centred column (max 760px). Sticky top bar; home with templates + forms; tabbed editor; a white "sheet" for respondents, paged by sections. */
:root{
  --bg:#F0F5F5; --surface:#FFFFFF; --line:#D2DEDE; --ink:#11292B; --muted:#587072;
  --accent:#0B7A75; --accent-ink:#FFFFFF; --accent-soft:#DCF0EE; --danger:#B3342A; --ok:#1E7A46;
  --c1:#0B7A75; --c2:#C2570C; --c3:#3B5BDB; --c4:#9C36B5; --c5:#B08900; --c6:#C2255C;
  --ui:'Cairo',system-ui,sans-serif; --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1819; --surface:#142425; --line:#254041; --ink:#E3F0EF; --muted:#8FA9A9;
  --accent:#3CC9BF; --accent-ink:#04201F; --accent-soft:#12383A; --danger:#FF8F80; --ok:#6FD39A;
  --c1:#3CC9BF; --c2:#FF9E57; --c3:#7C9CFF; --c4:#D68BEA; --c5:#E5C34A; --c6:#FF7BA9; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1819; --surface:#142425; --line:#254041; --ink:#E3F0EF; --muted:#8FA9A9;
  --accent:#3CC9BF; --accent-ink:#04201F; --accent-soft:#12383A; --danger:#FF8F80; --ok:#6FD39A;
  --c1:#3CC9BF; --c2:#FF9E57; --c3:#7C9CFF; --c4:#D68BEA; --c5:#E5C34A; --c6:#FF7BA9; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 56px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{line-height:1.3;text-wrap:balance;margin:0}
.wrap{max-width:760px;margin-inline:auto}
.muted{color:var(--muted)}
.grow{flex:1}

#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;margin-block:12px 20px}
.bar{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px 12px}
.brand{font-weight:700;font-size:1.05rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:4px 10px;cursor:pointer;font-size:.85rem;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;cursor:pointer;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.9rem}
.btn[disabled]{opacity:.55;cursor:default}
.ib{border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:1.1rem;line-height:1;padding:6px 8px;border-radius:6px}
.ib:hover{background:var(--accent-soft);color:var(--ink)}
.ib[disabled]{opacity:.35;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.in{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 12px;min-width:0}
textarea.in{resize:vertical}
.in:focus{border-color:var(--accent)}

.hero{display:grid;gap:10px;margin-bottom:22px}
.hero h1{font-size:1.5rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.list{display:grid;gap:10px;margin-top:18px}
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.frow .ft{flex:1;min-width:160px;font-weight:600}
.frow small{color:var(--muted)}
.tag{font-size:.8rem;border:1px solid var(--line);border-radius:99px;padding:0 10px;color:var(--muted)}
.note{border:1px dashed var(--line);border-radius:10px;padding:10px 14px;color:var(--muted);font-size:.92rem;margin:0}
.tpls{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tpls .btn{text-align:start;display:grid;gap:2px}
.tpls small{font-weight:400;color:var(--muted)}

.ehead{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tabs button{border:0;background:transparent;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.stack{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>label,.lab{font-size:.88rem;font-weight:600;color:var(--muted)}
.ftitle{font-size:1.35rem;font-weight:700}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grp{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.grp>h3{font-size:1rem}

.qcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:12px}
.qcard.sec{border-color:var(--accent);background:var(--accent-soft)}
.qrow{display:flex;flex-wrap:wrap;gap:10px}
.qrow .qt{flex:2 1 220px}.qrow .qty{flex:1 1 150px}
.orow{display:flex;align-items:center;gap:6px}
.orow input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
.mk{width:14px;height:14px;border:2px solid var(--muted);flex:none;border-radius:50%}
.mk.multi{border-radius:3px}.mk.drop,.mk.rank{border-radius:2px;border-width:0;width:auto;font-size:.85rem;color:var(--muted)}
.opts{display:grid;gap:6px}
.qfoot{display:flex;align-items:center;flex-wrap:wrap;gap:2px;border-top:1px solid var(--line);padding-top:8px}
.sw{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:.92rem}
.sw input{width:18px;height:18px;accent-color:var(--accent)}
.logic{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.9rem}
.logic select,.logic input{width:auto;min-width:120px;flex:1 1 130px}
.pts{width:80px!important;flex:none!important}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.swc{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);outline:1px solid var(--line);cursor:pointer;padding:0}
.swc[aria-pressed="true"]{outline:3px solid var(--ink)}
.himg{display:block;width:100%;height:auto;max-height:170px;object-fit:cover;border-radius:10px}

.chat{display:grid;gap:10px;max-height:46vh;overflow-y:auto}
.msg{padding:9px 13px;border-radius:12px;max-width:88%;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{background:var(--accent-soft);justify-self:start}
.msg.a{background:var(--surface);border:1px solid var(--line);justify-self:end}
.send{display:flex;gap:8px;align-items:flex-end}
.analysis{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--accent-soft);border-radius:10px;padding:12px 14px;line-height:1.8}

.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow .in{flex:1 1 240px;direction:ltr;text-align:left}
.qrbox{background:#fff;padding:12px;width:208px;max-width:100%;border-radius:10px;border:1px solid var(--line)} /* QR must stay black on white in both themes */
.qrbox svg{display:block;width:100%;height:auto}

.rsum{display:grid;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.rsum h3{font-size:1rem}
.bar2{display:grid;grid-template-columns:minmax(80px,1.2fr) 3fr 38px;gap:10px;align-items:center;font-size:.92rem}
.bar2 .tr{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar2 .fl{height:100%;background:var(--c1);border-radius:99px}
.bar2 b{font-variant-numeric:tabular-nums;text-align:end}
.txt{margin:0;padding-inline-start:1.2em;display:grid;gap:4px;font-size:.95rem}
.dwrap{display:flex;flex-wrap:wrap;align-items:center;gap:14px 22px}
.donut{width:150px;height:150px;flex:none;transform:rotate(0deg)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:4px;font-size:.92rem;flex:1 1 180px;min-width:0}
.legend li{display:flex;align-items:center;gap:8px;min-width:0}
.legend i{width:12px;height:12px;border-radius:3px;flex:none}
.legend span{flex:1;min-width:0;overflow-wrap:anywhere}
.legend b{font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:8px;height:130px;padding-top:6px}
.cols div{flex:1;min-width:0;display:grid;grid-template-rows:1fr auto auto;justify-items:center;height:100%;font-size:.85rem}
.cols em{display:block;width:100%;max-width:44px;background:var(--c1);border-radius:6px 6px 0 0;align-self:end}
.cols b{font-variant-numeric:tabular-nums}
.gscroll{overflow-x:auto}
.gt{border-collapse:collapse;min-width:100%;font-size:.9rem}
.gt th,.gt td{border:1px solid var(--line);padding:6px 10px;text-align:center}
.gt th:first-child{text-align:start}
.gt thead th{background:var(--accent-soft);font-weight:600}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,4vw,34px);display:grid;gap:22px}
.sheet h1{font-size:1.7em}
.sheet h2{font-size:1.3em}
.fq{display:grid;gap:10px}
.ql{font-weight:700}
.ql i{color:var(--danger);font-style:normal;margin-inline-start:4px}
.qd{margin:0;color:var(--muted);font-size:.92em}
.err{margin:0;color:var(--danger);font-size:.88em}
.choices{display:grid;gap:8px}
.ch{display:flex;align-items:center;gap:10px;cursor:pointer}
.ch input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.scale{display:flex;align-items:center;flex-wrap:wrap;gap:8px 14px}
.sn{display:flex;flex-wrap:wrap;gap:6px}
.sc{display:grid;justify-items:center;gap:2px;cursor:pointer;min-width:34px}
.sc input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.sl{font-size:.85em;color:var(--muted)}
.rk{display:flex;align-items:center;gap:10px}
.rk select{width:72px;flex:none}
.sheet .gt input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.pg{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pgbar{flex:1;height:6px;background:var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.pgbar i{display:block;height:100%;background:var(--accent)}
.done{text-align:center;display:grid;gap:14px;padding-block:20px}
.score{font-size:2em;font-weight:700;color:var(--accent)}
.wrong{text-align:start;display:grid;gap:6px;font-size:.95em}
.fail{color:var(--danger)}

@media (prefers-reduced-motion:no-preference){.btn,.tabs button{transition:border-color .15s,background .15s}}
</style>
</head>

/* المساعد الذكي: يمر عبر الخادم الذي يحمل مفتاح API ويتحقق من تسجيل دخولك */
const SAMPLE=async function(input,opts){
  const prompt=typeof input==='string'?input:input.map(x=>x.role+': '+x.content).join('\n');
  let r;
  try{r=await fetch('/api/ai',{method:'POST',headers:{'content-type':'application/json',authorization:'Bearer '+(S.session?S.session.access_token:'')},body:JSON.stringify({prompt:prompt})})}
  catch(e){throw {code:'upstream_error',message:'network'}}
  if(!r.ok)throw {code:r.status===401||r.status===501?'not_granted':r.status===429?'rate_limited':'upstream_error',message:'ai'};
  const j=await r.json();
  if(opts&&opts.onText)opts.onText({text:j.text,delta:j.text});
  return{text:j.text,truncated:false};
};
SAMPLE.json=async function(input,opts){
  const out=await SAMPLE(input,opts),text=out.text;
  const cand=[text];
  const fence=/```(?:json)?\s*([\s\S]*?)```/.exec(text);if(fence)cand.push(fence[1]);
  const a=text.search(/[\{\[]/),b=Math.max(text.lastIndexOf('}'),text.lastIndexOf(']'));
  if(a>=0&&b>a)cand.push(text.slice(a,b+1));
  for(const c of cand){try{return JSON.parse(c)}catch(e){}}
  throw {code:'invalid_json',message:'json',text:text};
};
const use=async n=>{if(n==='sample')return(CFG.ai&&S.session)?SAMPLE:null;return null};

/* المالك: جداول Supabase المحمية بسياسات RLS */
function ownerStore(){
  let list=[],cb=()=>{};
  const row=r=>Object.assign({},r.data,{id:r.id});
  return{
    newId:()=>crypto.randomUUID(),
    async watch(f){
      cb=f;
      const {data,error}=await SB.from('forms').select('id,data').order('created_at',{ascending:false});
      if(error){S.loadNote=true;render();return}
      S.loadNote=false;list=data.map(row);cb(list);
    },
    async get(id){const {data}=await SB.from('forms').select('id,data').eq('id',id).maybeSingle();return data?row(data):null},
    async save(f){
      const o=clone(f);delete o.id;
      const {error}=await SB.from('forms').upsert({id:f.id,owner:S.session.user.id,title:f.title||'',data:o,updated_at:new Date().toISOString()});
      if(error)throw error;
      const i=list.findIndex(x=>x.id===f.id),n=clone(f);if(i<0)list.push(n);else list[i]=n;cb(list);
    },
    async remove(id){const {error}=await SB.from('forms').delete().eq('id',id);if(error)throw error;list=list.filter(x=>x.id!==id);cb(list)},
    async responses(fid){
      const {data,error}=await SB.from('responses').select('answers,score,max,created_at').eq('form_id',fid).order('created_at',{ascending:false}).limit(5000);
      if(error)throw error;
      return data.map(r=>({answers:r.answers,score:r.score==null?undefined:Number(r.score),max:r.max==null?undefined:Number(r.max),at:Date.parse(r.created_at)}));
    }
  };
}
/* المجيب: عبر واجهات الخادم، دون حساب */
function publicStore(){
  const tok=()=>{try{let t=localStorage.getItem('sv_tok');if(!t){t=crypto.randomUUID();localStorage.setItem('sv_tok',t)}return t}catch(e){return null}};
  return{
    async get(id){const r=await fetch('/api/forms/'+encodeURIComponent(id));if(!r.ok)return null;return r.json()},
    async mine(fid){const t=tok();if(!t)return null;try{const r=await fetch('/api/forms/'+encodeURIComponent(fid)+'/mine?token='+encodeURIComponent(t));if(!r.ok)return null;return (await r.json()).response}catch(e){return null}},
    async submit(fid,payload){
      const r=await fetch('/api/submit',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({formId:fid,answers:payload.answers,token:tok()})});
      if(!r.ok){const e=new Error('submit');e.status=r.status;throw e}
      return r.json();
    }
  };
}

function mkQ(type,lg){
  const q={id:uid(),type:type,title:'',desc:'',required:false,options:[],min:1,max:5,minLabel:'',maxLabel:'',rows:[],cols:[],showIf:null,points:1,correct:[],correctText:''};

  if(type==='section') q.title=t('sec',lg);
  return q;
}
const idxOf=(f,id)=>f.questions.findIndex(x=>x.id===id);
const slim=f=>({title:f.title,description:f.desc,lang:f.lang,confirm:f.confirm,quiz:!!f.quiz,
  questions:f.questions.map(q=>{
    const o={type:q.type,title:q.title,description:q.desc,required:q.required,options:q.options,min:q.min,max:q.max,minLabel:q.minLabel,maxLabel:q.maxLabel,rows:rowsOf(q),cols:colsOf(q),points:q.points,correct:q.correct,correctText:q.correctText};
    if(q.showIf){const i=idxOf(f,q.showIf.q);if(i>=0)o.showIf={q:i+1,op:q.showIf.op,vi:q.showIf.vi,v:q.showIf.v}}
    return o;
  })});
function applyAI(f,r){
  const n=r&&r.form; if(!n||!Array.isArray(n.questions)) return false;
  if(typeof n.title==='string') f.title=n.title;
  if(typeof n.description==='string') f.desc=n.description;
  if(LI[n.lang]!==undefined) f.lang=n.lang;
  if(typeof n.confirm==='string') f.confirm=n.confirm;
  if(typeof n.quiz==='boolean') f.quiz=n.quiz;
  const old=f.questions;
  const src=n.questions.filter(q=>q&&TYPES.indexOf(q.type)>=0);
  const built=src.map(q=>{
    const m=old.find(o=>o.title===q.title&&o.type===q.type);
    const b=mkQ(q.type,f.lang);
    if(m) b.id=m.id;
    b.title=String(q.title||(q.type==='section'?t('sec',f.lang):''));
    b.desc=String(q.description||'');
    b.required=!!q.required&&q.type!=='section';
    if(OPTT.has(q.type)&&Array.isArray(q.options)&&q.options.length) b.options=q.options.map(String);
    if(q.type==='scale'){b.min=q.min===0?0:1;b.max=Math.min(10,Math.max(2,Number(q.max)||5));b.minLabel=String(q.minLabel||'');b.maxLabel=String(q.maxLabel||'')}
    if(q.type==='grid'||q.type==='gridm'){if(Array.isArray(q.rows)&&q.rows.length)b.rows=q.rows.map(String);if(Array.isArray(q.cols)&&q.cols.length)b.cols=q.cols.map(String)}
    b.points=Math.max(0,Number(q.points)||1);
    b.correct=Array.isArray(q.correct)?q.correct.map(Number).filter(i=>i>=0&&i<b.options.length):[];
    b.correctText=String(q.correctText||'');
    return b;
  });
  built.forEach((b,i)=>{
    const s=src[i].showIf;
    if(s&&s.q>=1&&s.q<=i){const sq=built[s.q-1];
      if(LOGSRC.has(sq.type)) b.showIf={q:sq.id,op:s.op==='ne'?'ne':'eq',vi:OPTT.has(sq.type)?Math.max(0,Number(s.vi)||0):undefined,v:s.v!=null?String(s.v):''};
    }
  });
  f.questions=built;
  return true;
}
function applyTranslation(f,r){
  const n=r&&r.form; if(!n||!Array.isArray(n.questions)||n.questions.length!==f.questions.length) return false;
  if(typeof n.title==='string') f.title=n.title;
  if(typeof n.description==='string') f.desc=n.description;
  if(typeof n.confirm==='string') f.confirm=n.confirm;
  if(LI[n.lang]!==undefined) f.lang=n.lang;
  f.questions.forEach((q,i)=>{
    const s=n.questions[i]||{};
    if(typeof s.title==='string') q.title=s.title;
    if(typeof s.description==='string') q.desc=s.description;
    if(Array.isArray(s.options)&&s.options.length===q.options.length) q.options=s.options.map(String);
    if(Array.isArray(s.rows)&&s.rows.length===rowsOf(q).length) q.rows=s.rows.map(String);
    if(Array.isArray(s.cols)&&s.cols.length===colsOf(q).length) q.cols=s.cols.map(String);
    if(typeof s.minLabel==='string') q.minLabel=s.minLabel;
    if(typeof s.maxLabel==='string') q.maxLabel=s.maxLabel;
    if(typeof s.correctText==='string'&&q.correctText) q.correctText=s.correctText;
  });
  return true;
}

async function askAI(msg,form,extra){
  const sample=await use('sample'); if(!sample) throw {code:'off'};
  let hist='';
  S.ai.turns.slice(-6).forEach(x=>{hist+=(x.r==='u'?'USER: ':'ASSISTANT: ')+x.text+'\n'});
  const prompt=SYS+'\n\nCURRENT FORM:\n'+JSON.stringify(slim(form))+(hist?'\n\nEARLIER MESSAGES:\n'+hist:'')+(extra?'\n\nSOURCE DOCUMENT (build the form from it):\n'+extra.slice(0,30000):'')+'\n\nUSER REQUEST:\n'+msg;
  return sample.json(prompt,{cache:false});
}

function logicHtml(q,i){

  let val='';
  if(src){
    if(OPTT.has(src.type))val=`<select class="in" data-q="lv">${src.options.map((o,j)=>`<option value="${j}"${c.vi===j?' selected':''}>${esc(o)}</option>`).join('')}</select>`;
    else if(src.type==='scale'){let o='';for(let v=src.min;v<=src.max;v++)o+=`<option${String(c.v)===String(v)?' selected':''}>${v}</option>`;val=`<select class="in" data-q="lv">${o}</select>`}

/* --- results --- */
function donut(keys,cnt,total){
  let off=25,seg='';
  keys.forEach((k,i)=>{const c=cnt(k);if(!c)return;const p=c/total*100;seg+=`<circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--c${i%6+1})" stroke-width="6" stroke-dasharray="${p.toFixed(2)} ${(100-p).toFixed(2)}" stroke-dashoffset="${off.toFixed(2)}"/>`;off-=p});
  return `<svg viewBox="0 0 42 42" class="donut" role="img" aria-label="chart"><circle r="15.9155" cx="21" cy="21" fill="none" stroke="var(--line)" stroke-width="6"/>${seg}<text x="21" y="23.2" text-anchor="middle" font-size="7" fill="var(--ink)" font-weight="700">${total}</text></svg>`;
}
function summary(q,rows){
  if(q.type==='section')return '';
  const vals=rows.map(r=>r.answers&&r.answers[q.id]).filter(v=>!emptyV(v));
  const head=`<h3>${esc(q.title||'—')} <small class="muted">· ${vals.length}</small></h3>`;
  let body='';
  if(q.type==='choice'||q.type==='drop'){
    const flat=vals.map(String);const keys=q.options.slice();flat.forEach(v=>{if(keys.indexOf(v)<0)keys.push(v)});
    const cnt=k=>flat.filter(v=>v===k).length,tot=flat.length||1;
    body=`<div class="dwrap">${donut(keys,cnt,flat.length)}<ul class="legend">${keys.map((k,i)=>`<li><i style="background:var(--c${i%6+1})"></i><span>${esc(k)}</span><b>${cnt(k)} · ${Math.round(cnt(k)/tot*100)}%</b></li>`).join('')}</ul></div>`;
  }else if(q.type==='multi'){
    const flat=[].concat.apply([],vals).map(String);const keys=q.options.slice();flat.forEach(v=>{if(keys.indexOf(v)<0)keys.push(v)});
    const cnt=k=>flat.filter(v=>v===k).length,max=Math.max(1,...keys.map(cnt));
    body=keys.map(k=>`<div class="bar2"><span>${esc(k)}</span><div class="tr"><div class="fl" style="width:${Math.round(cnt(k)/max*100)}%"></div></div><b>${cnt(k)}</b></div>`).join('');
  }else if(q.type==='scale'){
    const keys=[];for(let v=q.min;v<=q.max;v++)keys.push(v);
    const nums=vals.map(Number),cnt=k=>nums.filter(v=>v===k).length,max=Math.max(1,...keys.map(cnt));
    const avg=nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2):'—';
    body=`<div class="cols">${keys.map(k=>`<div><em style="height:${Math.round(cnt(k)/max*100)}%"></em><b>${cnt(k)}</b><span>${k}</span></div>`).join('')}</div><span class="muted">${t('avg')}: <b>${avg}</b></span>`;
  }else if(q.type==='grid'||q.type==='gridm'){
    const R=rowsOf(q),Cc=colsOf(q);
    const cnt=(r,c)=>vals.filter(v=>v&&(Array.isArray(v[r])?v[r].indexOf(c)>=0:v[r]===c)).length;
    body=`<div class="gscroll"><table class="gt"><thead><tr><th></th>${Cc.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${R.map(r=>`<tr><th scope="row">${esc(r)}</th>${Cc.map(c=>`<td>${cnt(r,c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;

/* ---------- fill view ---------- */
function qInput(q,lg){
  const n='q_'+q.id;
  switch(q.type){
    case 'long':return `<textarea class="in" id="${n}" name="${n}" rows="4"></textarea>`;
    case 'choice':return `<div class="choices">${q.options.map(o=>`<label class="ch"><input type="radio" name="${n}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
    case 'multi':return `<div class="choices">${q.options.map(o=>`<label class="ch"><input type="checkbox" name="${n}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join('')}</div>`;
    case 'drop':return `<select class="in" id="${n}" name="${n}"><option value="">${t('choose',lg)}</option>${q.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
    case 'scale':{let r='';for(let v=q.min;v<=q.max;v++)r+=`<label class="sc"><span>${v}</span><input type="radio" name="${n}" value="${v}"></label>`;
      return `<div class="scale"><span class="sl">${esc(q.minLabel)}</span><div class="sn">${r}</div><span class="sl">${esc(q.maxLabel)}</span></div>`}
    case 'grid':case 'gridm':{const R=rowsOf(q),Cc=colsOf(q),ty=q.type==='grid'?'radio':'checkbox';
      return `<div class="gscroll"><table class="gt"><thead><tr><th></th>${Cc.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${R.map((r,ri)=>`<tr><th scope="row">${esc(r)}</th>${Cc.map(c=>`<td><input type="${ty}" name="${n}__${ri}" value="${esc(c)}" aria-label="${esc(r+' - '+c)}"></td>`).join('')}</tr>`).join('')}</tbody></table></div>`}
    case 'rank':return `<div class="choices">${q.options.map((o,oi)=>`<label class="rk"><select class="in" name="${n}__${oi}" aria-label="${esc(o)}"><option value="">—</option>${q.options.map((x,k)=>`<option value="${k+1}">${k+1}</option>`).join('')}</select><span>${esc(o)}</span></label>`).join('')}</div>`;
    case 'date':return `<input class="in" type="date" id="${n}" name="${n}">`;
    case 'time':return `<input class="in" type="time" id="${n}" name="${n}">`;
    case 'email':return `<input class="in" type="email" id="${n}" name="${n}" dir="ltr">`;
    case 'number':return `<input class="in" type="number" id="${n}" name="${n}" dir="ltr">`;
    default:return `<input class="in" type="text" id="${n}" name="${n}">`;
  }
}
const LABFOR=new Set(['short','long','drop','date','time','email','number']);

function curPages(){const e=effective(S.fillForm,S.fill.ans||{});return pagesOf(S.fillForm).filter(p=>!p.sec||e.sec[p.sec.id])}
function viewFill(){

  const prog=P.length>1?`<div class="pg"><span class="sl">${t('pageOf',lg)} ${p+1} ${t('of',lg)} ${P.length}</span><div class="pgbar"><i style="width:${Math.round((p+1)/P.length*100)}%"></i></div></div>`:'';
  return `${pv}<article class="sheet" style="${st}">${head}${prog}${secH}
  <form id="fillform" novalidate style="display:grid;gap:22px">${pg.items.map(q=>`<section class="fq" data-qid="${q.id}"><label class="ql"${LABFOR.has(q.type)?` for="q_${q.id}"`:''}>${esc(q.title)}${q.required?'<i>*</i>':''}</label>${q.desc?`<p class="qd">${esc(q.desc)}</p>`:''}${qInput(q,lg)}<p class="err" data-err="${q.id}" hidden>${t('needed',lg)}</p></section>`).join('')}
  <p class="err fail" id="fillmsg" hidden></p>
  <div class="qrow">${p>0?`<button class="btn" type="button" data-act="fprev">${t('prev',lg)}</button>`:''}${last?`<button class="btn primary" type="submit">${t('submit',lg)}</button>`:`<button class="btn primary" type="button" data-act="fnext">${t('next',lg)}</button>`}</div></form></article>`;
}
function readQ(q,root){
  const n='q_'+q.id;
  if(q.type==='choice'){const e=root.querySelector(`input[name="${n}"]:checked`);return e?e.value:''}
  if(q.type==='scale'){const e=root.querySelector(`input[name="${n}"]:checked`);return e?Number(e.value):''}
  if(q.type==='multi')return Array.from(root.querySelectorAll(`input[name="${n}"]:checked`)).map(e=>e.value);
  if(q.type==='grid'||q.type==='gridm'){
    const o={};rowsOf(q).forEach((r,ri)=>{
      if(q.type==='grid'){const e=root.querySelector(`input[name="${n}__${ri}"]:checked`);if(e)o[r]=e.value}
      else{const a=Array.from(root.querySelectorAll(`input[name="${n}__${ri}"]:checked`)).map(e=>e.value);if(a.length)o[r]=a}
    });return o}
  if(q.type==='rank'){
    const pairs=[];q.options.forEach((op,oi)=>{const s=root.querySelector(`[name="${n}__${oi}"]`);if(s&&s.value)pairs.push({o:op,r:Number(s.value)})});
    const ranks=pairs.map(x=>x.r);
    if(new Set(ranks).size!==ranks.length)return[];
    return pairs.sort((a,b)=>a.r-b.r).map(x=>x.o)}
  const e=root.querySelector(`[name="${n}"]`);return e?String(e.value).trim():'';
}
function setQ(q,v,root){
  if(v==null)return;const n='q_'+q.id;
  const all=sel=>root.querySelectorAll(sel);
  if(q.type==='choice'||q.type==='scale')all(`input[name="${n}"]`).forEach(i=>{i.checked=i.value===String(v)});
  else if(q.type==='multi')all(`input[name="${n}"]`).forEach(i=>{i.checked=Array.isArray(v)&&v.indexOf(i.value)>=0});
  else if(q.type==='grid'||q.type==='gridm'){rowsOf(q).forEach((r,ri)=>{const rv=v[r];all(`input[name="${n}__${ri}"]`).forEach(i=>{i.checked=Array.isArray(rv)?rv.indexOf(i.value)>=0:i.value===rv})})}
  else if(q.type==='rank')q.options.forEach((o,oi)=>{const s=root.querySelector(`[name="${n}__${oi}"]`);const p=Array.isArray(v)?v.indexOf(o):-1;if(s)s.value=p>=0?String(p+1):''});
  else{const e=root.querySelector(`[name="${n}"]`);if(e)e.value=v}
}
function collectPage(){
  const root=$('#fillform');if(!root||!S.fillForm)return;
  const P=curPages(),pg=P[Math.min(S.fill.page||0,P.length-1)];if(!pg)return;

function applyLogic(){
  const f=S.fillForm,root=$('#fillform');if(!root)return;

}
function validatePage(){
  const f=S.fillForm,root=$('#fillform');let first=null;
  const P=curPages(),pg=P[Math.min(S.fill.page||0,P.length-1)];if(!pg)return true;
  pg.items.forEach(q=>{
    const el=root.querySelector(`.fq[data-qid="${q.id}"]`),er=root.querySelector(`[data-err="${q.id}"]`);
    if(!el||!er)return;
    let bad=false;
    if(!el.hidden){
      const v=S.fill.ans[q.id];
      if(q.type==='rank'){
        const raw=q.options.map((o,oi)=>{const s=root.querySelector(`[name="q_${q.id}__${oi}"]`);return s?s.value:''}).filter(Boolean);
        const dupe=new Set(raw).size!==raw.length;
        bad=dupe||(q.required&&raw.length!==q.options.length);
        er.textContent=dupe?t('rankErr',f.lang):t('needed',f.lang);
      }else bad=q.required&&!complete(q,v);
    }
    er.hidden=!bad;if(bad&&!first)first=er;
  });
  if(first){first.scrollIntoView({block:'center'});return false}
  return true;
}
function afterRender(){
  if(S.route.type!=='fill'||!S.fillForm||S.fill.done||S.fill.loading)return;

}

async function save(filename,data){
  const types={csv:'text/csv;charset=utf-8',svg:'image/svg+xml',xlsx:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',docx:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'};
  const blob=data instanceof Blob?data:new Blob([data],{type:types[filename.split('.').pop()]||'application/octet-stream'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function csvEsc(v){v=cellText(v);return '"'+v.replace(/"/g,'""')+'"'}
function cellText(v){
  if(v==null)return '';
  if(Array.isArray(v))return v.join(' | ');
  if(typeof v==='object')return Object.keys(v).map(k=>k+': '+(Array.isArray(v[k])?v[k].join(' | '):v[k])).join('; ');
  return String(v);
}
function tableData(){

  return [head].concat(body);
}

async function dlDocx(){
  if(!window.JSZip)return;

  const x=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
  const P=(text,o)=>{o=o||{};const sz=o.sz||24;return `<w:p><w:pPr>${rtl?'<w:bidi/>':''}<w:spacing w:after="${o.after==null?120:o.after}"/></w:pPr><w:r><w:rPr><w:rFonts w:ascii="${font}" w:hAnsi="${font}" w:cs="${font}"/>${o.b?'<w:b/><w:bCs/>':''}${rtl?'<w:rtl/>':''}<w:sz w:val="${sz}"/><w:szCs w:val="${sz}"/></w:rPr><w:t xml:space="preserve">${x(text)}</w:t></w:r></w:p>`};

    else if(q.type==='multi')q.options.forEach(o=>{body+=P('☐  '+o,{after:60})});
    else if(q.type==='rank')q.options.forEach(o=>{body+=P('____  '+o,{after:60})});
    else if(q.type==='scale'){let s='';for(let v=q.min;v<=q.max;v++)s+='○ '+v+'   ';body+=P((q.minLabel?q.minLabel+'   ':'')+s+(q.maxLabel?q.maxLabel:''))}
    else if(q.type==='grid'||q.type==='gridm'){const m=q.type==='grid'?'○ ':'☐ ';body+=P(colsOf(q).join('  |  '),{sz:20});rowsOf(q).forEach(r=>{body+=P(r+':   '+colsOf(q).map(c=>m+c).join('   '),{after:60})})}
    else if(q.type==='long'){body+=P('______________________________________________');body+=P('______________________________________________');body+=P('______________________________________________')}
    else body+=P('______________________________________________');
  });
  const z=new JSZip();
  z.file('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>');
  z.file('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>');
  z.file('word/document.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+body+'<w:sectPr/></w:body></w:document>');
  const ab=await z.generateAsync({type:'arraybuffer'});

}

async function analyze(){

    const o={question:q.title,type:q.type,answered:vals.length};
    if(OPTT.has(q.type)||q.type==='scale'){const c={};vals.forEach(v=>{(Array.isArray(v)?v:[v]).forEach(x=>{c[x]=(c[x]||0)+1})});o.counts=c}
    else if(q.type==='grid'||q.type==='gridm'){o.answers=vals.slice(0,60).map(v=>cellText(v))}
    else o.answers=vals.slice(0,60).map(v=>String(v).slice(0,240));
    return o;
  });
  const prompt='You analyze survey results. Write in '+LNAME[f.lang]+'. Give: (1) a 2-3 sentence overview, (2) the most notable findings with numbers, (3) patterns or contradictions in the open-text answers, (4) three concrete recommendations. Use short plain paragraphs and simple dashes for lists, no markdown symbols like # or *. Do not invent data.\n\nForm title: '+f.title+'\nTotal responses: '+rows.length+'\n\nDATA:\n'+JSON.stringify(data);
  R.aiBusy=true;R.aiErr='';R.analysis='';render();
  try{
    await sample(prompt,{onText:({text})=>{R.analysis=text;const el=$('#analysis');if(el)el.textContent=text;else render()}});
  }catch(e){R.aiErr=e&&(e.code==='not_granted'||e.code==='sampling_disabled')?t('aiOff'):t('aiErr');if(e&&e.text&&!R.analysis)R.analysis=e.text}
  R.aiBusy=false;if(S.route.type==='edit'&&S.tab==='resp'&&S.resp===R)render();
}
async function sendAI(){
  const el=$('#aiq');const msg=el?el.value.trim():'';if(!msg||S.ai.busy)return;
  S.ai.busy=true;S.ai.err='';render();
  try{
    const r=await askAI(msg,S.cur);
    S.ai.turns.push({r:'u',text:msg});
    S.ai.turns.push({r:'a',text:String(r&&r.reply||'')||'✓'});
    if(S.cur&&applyAI(S.cur,r))touch();
  }catch(e){S.ai.err=e&&(e.code==='off'||e.code==='not_granted')?t('aiOff'):t('aiErr')}
  S.ai.busy=false;if(S.route.type==='edit'&&S.tab==='ai')render();
}
async function homeAI(){
  const el=$('#hai');const msg=el?el.value.trim():'';
  if((!msg&&!S.homeFile)||S.homeAi.busy)return;
  S.homeAi={busy:true,err:''};render();
  const f=blank(S.ui);
  try{
    const r=await askAI(msg||'Build a suitable survey form from the source document.',f,S.homeFile?S.homeFile.text:'');
    if(!applyAI(f,r)) throw {code:'bad'};
    S.homeAi={busy:false,err:''};S.homeFile=null;
    await createForm(f);
  }catch(e){S.homeAi={busy:false,err:e&&(e.code==='off'||e.code==='not_granted')?t('aiOff'):t('aiErr')};render()}
}
async function translate(){
  const sel=$('#trl');if(!sel||S.trBusy)return;const target=sel.value;
  S.trBusy=true;S.trErr='';render();
  try{
    const sl=await use('sample');if(!sl)throw {code:'off'};
    const prompt='Translate this survey form from '+LNAME[S.cur.lang]+' to '+LNAME[target]+'. Reply with ONLY a JSON object {"form":{"title":string,"description":string,"confirm":string,"lang":"'+target+'","questions":[...]}}. The questions array MUST have exactly the same number and order of items as the input. For every item translate "title", "description", "minLabel", "maxLabel", "correctText" (if not empty, keep numbers), and translate every string in "options", "rows" and "cols" keeping each array the same length and order. Do not change anything else.\n\nFORM:\n'+JSON.stringify(slim(S.cur));
    const r=await sl.json(prompt,{cache:false});
    if(!applyTranslation(S.cur,r))throw {code:'bad'};
    touch();
  }catch(e){S.trErr=e&&(e.code==='off'||e.code==='not_granted')?t('aiOff'):t('aiErr')}
  S.trBusy=false;if(S.route.type==='edit')render();
}
function copyLink(btn){
  const el=$('#lnk');const link=el.value;
  const ok=()=>{btn.textContent=t('copied');setTimeout(()=>{btn.textContent=t('copy')},1500)};
  try{navigator.clipboard.writeText(link).then(ok,()=>{el.select()})}catch(e){el.select()}
}
function readImage(file){
  const rd=new FileReader();
  rd.onload=()=>{const im=new Image();im.onload=()=>{
    const W=1000,H=280,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
    const s=Math.max(W/im.width,H/im.height),w=im.width*s,h=im.height*s;g.drawImage(im,(W-w)/2,(H-h)/2,w,h);
    S.cur.header=c.toDataURL('image/jpeg',0.75);touch();render()};im.src=rd.result};
  rd.readAsDataURL(file);
}
function dropOptionRefs(q,j){
  q.correct=q.correct.filter(k=>k!==j).map(k=>k>j?k-1:k);
  S.cur.questions.forEach(o=>{if(o.showIf&&o.showIf.q===q.id&&typeof o.showIf.vi==='number'){if(o.showIf.vi===j)o.showIf=null;else if(o.showIf.vi>j)o.showIf.vi--}});
}

/* ---------- fill flow ---------- */
function goNext(){
  collectPage();if(!validatePage())return;
  S.fill.page=(S.fill.page||0)+1;render();window.scrollTo(0,0);
}
async function submitFill(){
  const f=S.fillForm;if(S.fill.busy)return;
  collectPage();if(!validatePage())return;
  const eff=effective(f,S.fill.ans).eff,answers={};
  Object.keys(eff).forEach(k=>{const v=eff[k];if(!emptyV(v)&&!(typeof v==='object'&&!Array.isArray(v)&&!Object.keys(v).length))answers[k]=v});
  const payload={formId:f.id,answers:answers,at:Date.now()};
  let result=null;
  if(f.quiz){result=gradeAll(f,eff);payload.score=result.score;payload.max=result.max}
  if(S.route.preview){S.fill={done:true,result:result,ans:S.fill.ans,page:0};render();window.scrollTo(0,0);return}
  S.fill.busy=true;
  const btn=$('#fillform button[type=submit]');if(btn)btn.disabled=true;
  try{const res=await store.submit(f.id,payload,!!f.oneResp);S.fill={done:true,result:(res&&res.result)||null,ans:f.oneResp?answers:{},page:0};render();window.scrollTo(0,0)}
  catch(x){S.fill.busy=false;if(btn)btn.disabled=false;const m=$('#fillmsg');if(m){m.textContent=x&&x.status===403?t('closed',f.lang):t('submitFail',f.lang);m.hidden=false}}
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,f=S.cur,i=+b.dataset.i;
  if(a==='lang'){S.ui=b.dataset.v;try{localStorage.setItem('sv_ui',S.ui)}catch(x){}render()}
  else if(a==='theme'){const d=document.documentElement;const dark=d.dataset.theme?d.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;d.dataset.theme=dark?'light':'dark';try{localStorage.setItem('sv_th',d.dataset.theme)}catch(x){}}
  else if(a==='signin'||a==='signup'){
    const em=$('#em').value.trim(),pw=$('#pw').value,msg=$('#authmsg');
    const say=(x,ok)=>{msg.textContent=x;msg.hidden=!x;msg.style.color=ok?'var(--ok)':''};
    if(!em||!pw){say(t('authNeed'));return}
    b.disabled=true;
    if(a==='signin'){const {error}=await SB.auth.signInWithPassword({email:em,password:pw});if(error){say(error.message);b.disabled=false}}
    else{const {data,error}=await SB.auth.signUp({email:em,password:pw});b.disabled=false;if(error)say(error.message);else if(!data.session)say(t('confirmMail'),true)}
  }
  else if(a==='signout'){await SB.auth.signOut()}
  else if(a==='new')createForm(blank(S.ui));
  else if(a==='tpl')createForm(TPLS[+b.dataset.v].make(S.ui));
  else if(a==='aihome')homeAI();
  else if(a==='open')openEdit(b.dataset.id);
  else if(a==='back'){await flush();S.cur=null;if(location.hash)location.hash='';setRoute({type:'home'})}
  else if(a==='tab'){S.tab=b.dataset.v;S.delArm=false;render();if(S.tab==='resp'&&!S.resp)loadResp()}
  else if(a==='addq'){f.questions.push(mkQ($('#newtype').value,f.lang));touch();render()}
  else if(a==='qdel'){f.questions.splice(i,1);touch();render()}
  else if(a==='qup'&&i>0){f.questions.splice(i-1,0,f.questions.splice(i,1)[0]);touch();render()}
  else if(a==='qdn'&&i<f.questions.length-1){f.questions.splice(i+1,0,f.questions.splice(i,1)[0]);touch();render()}
  else if(a==='qdup'){const c=clone(f.questions[i]);c.id=uid();c.showIf=null;f.questions.splice(i+1,0,c);touch();render()}
  else if(a==='addopt'){const q=f.questions[i];q.options.push(t('opt',f.lang)+' '+(q.options.length+1));touch();render()}
  else if(a==='delopt'){const q=f.questions[i],j=+b.dataset.j;if(q.options.length>1){q.options.splice(j,1);dropOptionRefs(q,j);touch();render()}}
  else if(a==='acc'){f.accent=b.dataset.v;touch();render()}
  else if(a==='rmimg'){f.header='';touch();render()}
  else if(a==='translate')translate();
  else if(a==='preview'){await flush();S.fillForm=clone(S.cur);S.fill={ans:{},page:0};setRoute({type:'fill',preview:true,id:S.cur.id})}
  else if(a==='exitpreview'){S.fill={};setRoute({type:'edit'})}
  else if(a==='copy')copyLink(b);
  else if(a==='dlqr')dlQr();
  else if(a==='docx')dlDocx();
  else if(a==='refresh')loadResp();
  else if(a==='csv')dlCsv();
  else if(a==='xlsx')dlXlsx();
  else if(a==='analyze')analyze();
  else if(a==='askai')sendAI();
  else if(a==='again'){S.fill={ans:{},page:0};render();window.scrollTo(0,0)}
  else if(a==='fnext')goNext();
  else if(a==='fprev'){collectPage();S.fill.page=Math.max(0,(S.fill.page||0)-1);render();window.scrollTo(0,0)}
  else if(a==='delform'){
    if(!S.delArm){S.delArm=true;render();return}
    const id=S.cur.id;S.cur=null;S.forms=S.forms.filter(x=>x.id!==id);
    try{await store.remove(id)}catch(x){}
    setRoute({type:'home'});
  }
});
document.addEventListener('input',e=>{
  const el=e.target,f=S.cur;
  if(el.closest&&el.closest('#fillform')){collectPage();applyLogic();return}
  if(el.id==='lnk'){S.link=el.value.trim();renderQr();return}
  if(!f||S.route.type!=='edit')return;
  const fk=el.dataset.form;
  if(fk==='title'||fk==='desc'||fk==='confirm'){f[fk]=el.value;touch();return}
  const card=el.closest('.qcard');if(!card||!el.dataset.q)return;
  const q=f.questions[+card.dataset.i],k=el.dataset.q;
  if(k==='title'||k==='minLabel'||k==='maxLabel'||k==='desc')q[k]=el.value;
  else if(k==='opt')q.options[+el.dataset.j]=el.value;
  else if(k==='rows'||k==='cols')q[k]=el.value.split('\n');
  else if(k==='points')q.points=Math.max(0,Number(el.value)||0);
  else if(k==='ctext')q.correctText=el.value;
  else if(k==='lv'&&q.showIf){q.showIf.v=el.value}
  else return;
  touch();
});
document.addEventListener('change',async e=>{
  const el=e.target,f=S.cur;
  if(el.closest&&el.closest('#fillform')){collectPage();applyLogic();return}
  if(el.id==='hfile'){
    const file=el.files&&el.files[0];if(!file){S.homeFile=null;return}
    try{
      let text='';
      if(/\.docx$/i.test(file.name)){if(!window.mammoth)throw 0;text=(await mammoth.extractRawText({arrayBuffer:await file.arrayBuffer()})).value}
      else text=await file.text();
      S.homeFile={name:file.name,text:text};S.homeAi.err='';
    }catch(x){S.homeFile=null;S.homeAi.err=t('fileErr')}
    const ta=$('#hai'),v=ta?ta.value:'';render();const n=$('#hai');if(n)n.value=v;return;
  }
  if(el.id==='himg'&&el.files&&el.files[0]&&f){readImage(el.files[0]);return}
  if(!f||S.route.type!=='edit')return;
  const fk=el.dataset.form;
  if(fk==='lang'||fk==='font'){f[fk]=el.value;touch();render();return}
  if(fk==='accepting'||fk==='oneResp'||fk==='quiz'||fk==='showScore'){f[fk]=el.checked;touch();if(fk==='quiz')render();return}
  if(fk==='closeAt'){const d=el.value?new Date(el.value):null;f.closeAt=d&&!isNaN(d)?d.toISOString():'';touch();return}
  if(fk==='maxResponses'){f.maxResponses=Math.max(0,Math.floor(Number(el.value)||0));touch();return}
  const card=el.closest('.qcard');if(!card||!el.dataset.q)return;
  const q=f.questions[+card.dataset.i],k=el.dataset.q,qi=+card.dataset.i;
  if(k==='type'){q.type=el.value;if(OPTT.has(q.type)&&!q.options.length)q.options=[t('opt',f.lang)+' 1',t('opt',f.lang)+' 2'];
    if((q.type==='grid'||q.type==='gridm')&&!rowsOf(q).length){q.rows=[t('row',f.lang)+' 1',t('row',f.lang)+' 2'];q.cols=[t('col',f.lang)+' 1',t('col',f.lang)+' 2',t('col',f.lang)+' 3']}
    q.correct=[];touch();render()}
  else if(k==='req'){q.required=el.checked;touch()}
  else if(k==='min'||k==='max'){q[k]=+el.value;if(q.min>=q.max)q.max=q.min+1;touch();render()}
  else if(k==='corr'){const j=+el.dataset.j;
    if(q.type==='multi'){const p=q.correct.indexOf(j);if(el.checked&&p<0)q.correct.push(j);else if(!el.checked&&p>=0)q.correct.splice(p,1)}
    else q.correct=el.checked?[j]:[];
    touch();render()}
  else if(k==='lq'){
    if(!el.value)q.showIf=null;
    else{const s=f.questions.find(x=>x.id===el.value);q.showIf={q:el.value,op:'eq',vi:OPTT.has(s.type)?0:undefined,v:s.type==='scale'?String(s.min):''}}
    touch();render()}
  else if(k==='lop'&&q.showIf){q.showIf.op=el.value;touch()}
  else if(k==='lv'&&q.showIf){const s=f.questions.find(x=>x.id===q.showIf.q);if(s&&OPTT.has(s.type))q.showIf.vi=+el.value;else q.showIf.v=el.value;touch()}
});
document.addEventListener('submit',e=>{
  if(e.target.id!=='fillform')return;
  e.preventDefault();
  const P=curPages();
  if((S.fill.page||0)<P.length-1)goNext();else submitFill();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){if(e.target.id==='aiq')sendAI();if(e.target.id==='hai')homeAI()}});

/* ---------- boot ---------- */
function parseRoute(){const m=/^\/f\/([A-Za-z0-9_-]+)\/?$/.exec(location.pathname);return m?{type:'fill',id:m[1]}:null}
async function loadFill(id){
  S.fill={loading:true};S.fillForm=null;render();
  let f=null,mine=null;
  try{f=await store.get(id)}catch(e){}
  if(f){f=Object.assign(blank(f.lang||'ar'),f);f.questions=(f.questions||[]).map(q=>Object.assign(mkQ(q.type,f.lang),q))}
  S.fillForm=f;
  S.fill={ans:{},page:0};
  if(f&&f.oneResp&&!S.route.preview){mine=await store.mine(id);if(mine&&mine.answers){S.fill.ans=clone(mine.answers);S.fill.edit=true}}
  render();
}
async function boot(){
  try{const u=localStorage.getItem('sv_ui');if(LI[u]!==undefined)S.ui=u;const th=localStorage.getItem('sv_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
  const r=parseRoute();if(r)S.route=r;
  render();
  try{CFG=await (await fetch('/api/config')).json()}catch(e){CFG={}}
  if(r){store=publicStore();S.ready=true;await loadFill(r.id);return}
  if(!CFG.supabaseUrl||!CFG.supabaseKey||!window.supabase){S.setupErr=true;S.ready=true;render();return}
  SB=window.supabase.createClient(CFG.supabaseUrl,CFG.supabaseKey);
  const {data}=await SB.auth.getSession();S.session=data.session;
  SB.auth.onAuthStateChange((ev,ses)=>{const had=!!S.session;S.session=ses;if(!!ses!==had)location.reload()});
  S.ready=true;
  if(S.session){store=ownerStore();S.canEdit=true;render();await store.watch(list=>{S.forms=list;if(S.route.type==='home')render()})}
  render();
}
boot();
})();
</script>
